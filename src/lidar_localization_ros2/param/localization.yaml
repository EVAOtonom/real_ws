/**:
  ros__parameters:
    registration_method: "NDT_OMP"

    score_threshold: 2.0

    ndt_resolution: 1.0
    ndt_step_size: 0.1
    ndt_num_threads: 4
    ndt_max_iterations: 35
    transform_epsilon: 0.01

    voxel_leaf_size: 0.2

    scan_max_range: 80.0
    scan_min_range: 3.0
    scan_period: 0.1

    use_pcd_map: true
    map_path: "/home/otonom/real_ws/map.pcd"

    # External /initialpose or GPS-based initializer should provide the first pose.
    set_initial_pose: true

    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0

    # Local EKF odometry is used only as the NDT prediction / initial guess.
    use_odom: true

    # IMU is already used by LIO-SAM/local EKF; keep the localizer path simple.
    use_imu: false

    enable_debug: true

    # IMPORTANT: global EKF is the sole map -> odom publisher.
    enable_map_odom_tf: false

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint

    enable_timer_publishing: false
    pose_publish_frequency: 30.0
