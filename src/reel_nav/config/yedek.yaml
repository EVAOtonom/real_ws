controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0
    goal_checker_plugins: ["general_goal_checker"]
    use_collision_checker: true
    progress_checker.movement_time_allowance: 50.0
    progress_checker.required_movement_radius: 0.001
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.7
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.8

      min_approach_linear_velocity: 0.08 #minumum yavaşlama hızı
      approach_velocity_scaling_dist: 2.0 #hedefe yazan değer kadar metre geriden yavaşlamaya başlıyor

      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true

      # ==========================================
      # LOOKAHEAD
      # ==========================================

      # Daha uzağa bak → daha yumuşak direksiyon
      lookahead_dist: 5.0

      min_lookahead_dist: 1.8
      max_lookahead_dist: 7.0

      # 0.7 m/s × 1.5 sec ~= 1.05m lookahead
      lookahead_time: 1.0

      use_velocity_scaled_lookahead_dist: true

      use_fixed_curvature_lookahead: false

      use_interpolation: true

      max_robot_pose_search_dist: 5.0

      # ==========================================
      # ACKERMANN
      # ==========================================

      use_rotate_to_heading: false

      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5

      # ==========================================
      # VIRAJDA HIZ DUSUR
      # ==========================================

      use_regulated_linear_velocity_scaling: true

      # ÖNEMLİ:
      # fiziksel min radius 1.5 fakat RPP'nin
      # hız düşürmeye daha erken başlamasını istiyoruz.
      regulated_linear_scaling_min_radius: 2.5

      regulated_linear_scaling_min_speed: 0.20

      use_cost_regulated_linear_velocity_scaling: false

      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.2

      transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:

      update_frequency: 8.0
      publish_frequency: 8.0

      global_frame: odom
      robot_base_frame: base_footprint

      use_sim_time: False

      rolling_window: true

      width: 12
      height: 12
      resolution: 0.1

      footprint: "[[1.35, 0.775], [1.35, -0.775], [-1.35, -0.775], [-1.35, 0.775]]"

      plugins:
        - voxel_layer
        - inflation_layer


      # ============================================================
      # VOXEL / OBSTACLE LAYER
      # ============================================================

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"

        enabled: True
        publish_voxel_map: False

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16

        max_obstacle_height: 3.0
        mark_threshold: 0

        observation_sources:
          scan
          lane_pointcloud
          sign_obstacles


        # ============================================================
        # RSLIDAR -> POINTCLOUD_TO_LASERSCAN -> /scan_nav
        # ============================================================

        scan:
          topic: /scan_nav
          data_type: "LaserScan"

          clearing: True
          marking: True

          # pointcloud_to_laserscan:
          # range_min = 0.50
          # range_max = 12.0
          #
          # Local costmap 12x12 olduğu için aracın merkezinden
          # yaklaşık 6 metre çevre tutuluyor.
          obstacle_min_range: 0.50
          obstacle_max_range: 5.8

          raytrace_min_range: 0.50
          raytrace_max_range: 6.0

          # pointcloud_to_laserscan use_inf=True olduğu için önemli.
          inf_is_valid: true

          # Eski lidar ölçümlerini 6 saniye tutma.
          # Hareketli engellerde ghost obstacle oluşturabilir.
          observation_persistence: 0.0

          expected_update_rate: 0.0


        # ============================================================
        # LANE POINTCLOUD
        # ============================================================

        lane_pointcloud:
          topic: /lane_pointcloud

          data_type: "PointCloud2"

          max_obstacle_height: 2.0

          clearing: True
          marking: True

          raytrace_max_range: 10.0
          raytrace_min_range: 0.0

          obstacle_max_range: 10.5
          obstacle_min_range: 0.0

          observation_persistence: 3.0


        # ============================================================
        # SIGN OBSTACLES
        # ============================================================

        sign_obstacles:
          topic: /sign_obstacles

          data_type: "PointCloud2"

          max_obstacle_height: 2.0

          clearing: True
          marking: True

          raytrace_max_range: 30.0
          raytrace_min_range: 0.0

          obstacle_max_range: 30.0
          obstacle_min_range: 0.0


      # ============================================================
      # INFLATION
      # ============================================================

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 1.2
        inflation_radius: 1.5

        always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:

      always_send_full_costmap: True

      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint

      use_sim_time: False

      footprint: "[[1.35, 0.775], [1.35, -0.775], [-1.35, -0.775], [-1.35, 0.775]]"

      resolution: 0.1

      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - middle_lane_cost_layer
        - inflation_layer


      # ============================================================
      # STATIC MAP
      # ============================================================

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True


      # ============================================================
      # OBSTACLE LAYER
      # ============================================================

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: True

        observation_sources:
          scan
          lane_pointcloud
          sign_obstacles_global


        # ============================================================
        # RSLIDAR -> /scan_nav
        # ============================================================

        scan:
          topic: /scan_nav
          data_type: "LaserScan"

          clearing: True
          marking: True

          # pointcloud_to_laserscan:
          # range_min = 0.50
          # range_max = 12.0

          obstacle_min_range: 0.50

          # Son 50 cm'yi sadece clearing için bırakıyoruz.
          obstacle_max_range: 11.5

          raytrace_min_range: 0.50
          raytrace_max_range: 12.0

          inf_is_valid: true

          observation_persistence: 0.0

          expected_update_rate: 0.0


        # ============================================================
        # LANE POINTCLOUD
        # ============================================================

        lane_pointcloud:
          topic: /lane_pointcloud

          data_type: "PointCloud2"

          max_obstacle_height: 2.0

          clearing: True
          marking: True

          raytrace_max_range: 3.0
          raytrace_min_range: 0.0

          obstacle_max_range: 3.5
          obstacle_min_range: 0.0

          observation_persistence: 3.0


        # ============================================================
        # SIGN OBSTACLES GLOBAL
        # ============================================================

        sign_obstacles_global:
          topic: /sign_obstacles_global

          data_type: "PointCloud2"

          max_obstacle_height: 2.0

          clearing: True
          marking: True

          raytrace_max_range: 50.0
          raytrace_min_range: 0.0

          obstacle_max_range: 50.0
          obstacle_min_range: 0.0


      # ============================================================
      # MIDDLE LANE COST
      # ============================================================

      middle_lane_cost_layer:
        plugin: "middle_lane_cost_layer::MiddleLaneCostLayer"

        enabled: true

        csv_path: "/home/otonom/real_ws/src/middle_lane_cost_layer/config/road_segments_50_points.csv"

        lane_half_width: 1.5
        lane_cost: 200


      # ============================================================
      # INFLATION
      # ============================================================

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 1.2
        inflation_radius: 1.5


map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:

    planner_plugins: ["GridBased"]
    use_sim_time: False

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # ==========================================
      # PATH KALITESI
      # ==========================================

      # Önce kaliteyi görelim.
      # 5cm costmap varsa planner yine 5cm üzerinden çalışsın.
      downsample_costmap: false
      downsampling_factor: 1

      tolerance: 0.5
      allow_unknown: true

      max_iterations: -1

      # 2 çok düşük.
      # Goal yakınında düzgün çözüm aramasına izin ver.
      max_on_approach_iterations: 1000

      max_planning_time: 10.0

      # Ackermann + sadece ileri
      motion_model_for_search: "DUBIN"

      # ==========================================
      # ACKERMANN DONUS GEOMETRISI
      # ==========================================

      # Fiziksel minimum dönüş yarıçapı.
      # DOKUNMUYORUZ.
      minimum_turning_radius: 1.4

      # Ara heading / curvature seçeneklerini artır.
      #
      # Interpolation açıldığı için 72 yapmak yerine
      # 32-36 civarı iyi başlangıç.
      angle_quantization_bins: 72
      allow_primitive_interpolation: true

      # ==========================================
      # DUZ GITME TERCIHI
      # ==========================================

      # 10.0 aşırı yüksek.
      # Düz yolu yine tercih etsin ama viraj gerektiğinde
      # doğal şekilde yay oluşturabilsin.
      non_straight_penalty: 2.0

      # DUBIN'de reverse zaten kullanılmaz.
      reverse_penalty: 2.0

      change_penalty: 0.50

      # 5.0 biraz agresif.
      # Costmap merkezine yapışmaya çalışıp path'i bozmasın.
      cost_penalty: 2.0

      retrospective_penalty: 0.15

      # ==========================================
      # ANALYTIC EXPANSION
      # ==========================================

      analytic_expansion_ratio: 3.5

      # 1.5m minimum radius için 3m kısa.
      # Nav2 dokümantasyonu 4-5 x min radius öneriyor.
      analytic_expansion_max_length: 7.5

      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false

      lookup_table_size: 20.0

      cache_obstacle_heuristic: true
      debug_visualizations: false

      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: false

      goal_heading_mode: "DEFAULT"

      # ==========================================
      # PATH SMOOTHING
      # ==========================================

      smooth_path: true

      smoother:
        max_iterations: 1500

        # Path'in zig-zag/köşelerini bastır.
        w_smooth: 0.4

        # Orijinal path'e bağlılık
        w_data: 0.2

        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 3

smoother_server:
  ros__parameters:
    use_sim_time: False
