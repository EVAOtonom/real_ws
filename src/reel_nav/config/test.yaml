planner_server:
  ros__parameters:

    planner_plugins: ["GridBased", "ParkingGrid"]

    use_sim_time: False


    # ==========================================================
    # NORMAL SÜRÜŞ PLANNER
    # SADECE İLERİ
    # ==========================================================
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # ==========================================
      # PATH KALITESI
      # ==========================================

      downsample_costmap: false
      downsampling_factor: 1

      tolerance: 0.5

      allow_unknown: true

      max_iterations: -1

      max_on_approach_iterations: 1000

      max_planning_time: 10.0

      # ==================================================
      # SADECE İLERİ
      # ==================================================
      motion_model_for_search: "DUBIN"

      # ==========================================
      # ACKERMANN DONUS GEOMETRISI
      # ==========================================

      minimum_turning_radius: 2.5

      angle_quantization_bins: 72

      allow_primitive_interpolation: true

      # ==========================================
      # DUZ GITME TERCIHI
      # ==========================================

      non_straight_penalty: 2.0

      # DUBIN zaten reverse kullanmaz.
      reverse_penalty: 2.0

      change_penalty: 0.50

      cost_penalty: 2.0

      retrospective_penalty: 0.15

      # ==========================================
      # ANALYTIC EXPANSION
      # ==========================================

      analytic_expansion_ratio: 3.5

      analytic_expansion_max_length: 7.5

      analytic_expansion_max_cost: 200.0

      analytic_expansion_max_cost_override: false

      lookup_table_size: 20.0

      cache_obstacle_heuristic: true

      debug_visualizations: false

      use_quadratic_cost_penalty: false

      downsample_obstacle_heuristic: false

      goal_heading_mode: "DEFAULT"

      # ==========================================
      # PATH SMOOTHING
      # ==========================================

      smooth_path: true

      smoother:
        max_iterations: 1500

        w_smooth: 0.4

        w_data: 0.2

        tolerance: 1.0e-10

        do_refinement: true

        refinement_num: 3


    # ==========================================================
    # PARK PLANNER
    # İLERİ + GERİ
    # ==========================================================
    ParkingGrid:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      downsample_costmap: false
      downsampling_factor: 1

      tolerance: 0.3

      allow_unknown: true

      max_iterations: -1

      max_on_approach_iterations: 2000

      max_planning_time: 10.0

      # ==================================================
      # İLERİ + GERİ ACKERMANN
      # ==================================================
      motion_model_for_search: "DUBIN"

      # Araç fiziksel minimum dönüş yarıçapı.
      minimum_turning_radius: 2.5

      angle_quantization_bins: 72

      allow_primitive_interpolation: true

      # ==========================================
      # MANEVRA MALİYETLERİ
      # ==========================================

      non_straight_penalty: 1.2

      # Geri gitmeye izin ver fakat gereksiz yere
      # geri gitmesini biraz cezalandır.
      reverse_penalty: 2.0

      # İleri -> geri veya geri -> ileri
      # geçişlerinin maliyeti.
      change_penalty: 0.15

      cost_penalty: 2.0

      retrospective_penalty: 0.15

      # ==========================================
      # ANALYTIC EXPANSION
      # ==========================================

      analytic_expansion_ratio: 3.5

      analytic_expansion_max_length: 7.5

      analytic_expansion_max_cost: 200.0

      analytic_expansion_max_cost_override: false

      lookup_table_size: 20.0

      cache_obstacle_heuristic: true

      debug_visualizations: false

      use_quadratic_cost_penalty: false

      downsample_obstacle_heuristic: false

      goal_heading_mode: "DEFAULT"

      # ==========================================
      # PATH SMOOTHING
      # ==========================================

      smooth_path: false

      smoother:
        max_iterations: 1500

        w_smooth: 0.4

        w_data: 0.2

        tolerance: 1.0e-10

        do_refinement: true

        refinement_num: 3


smoother_server:
  ros__parameters:

    use_sim_time: False

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      tolerance: 1.0e-10

      max_its: 1000

      do_refinement: True


behavior_server:
  ros__parameters:

    # =====================================================
    # COSTMAP / FOOTPRINT
    # =====================================================

    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0


    # =====================================================
    # BEHAVIOR PLUGINS
    #
    # ÖNEMLİ:
    # "backup" burada mutlaka bulunmalı.
    # Humble default BT XML'i "backup" action server'ını bekliyor.
    # =====================================================

    behavior_plugins:
      [
        "spin",
        "backup",
        "drive_on_heading",
        "assisted_teleop",
        "wait"
      ]


    # =====================================================
    # SPIN
    # =====================================================

    spin:
      plugin: "nav2_behaviors/Spin"


    # =====================================================
    # BACKUP
    #
    # Hatanı çözecek ana kısım burası.
    # Action server adı:
    #
    # /backup
    #
    # olacaktır.
    # =====================================================

    backup:
      plugin: "nav2_behaviors/BackUp"


    # =====================================================
    # DRIVE ON HEADING
    # =====================================================

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"


    # =====================================================
    # WAIT
    # =====================================================

    wait:
      plugin: "nav2_behaviors/Wait"


    # =====================================================
    # ASSISTED TELEOP
    # =====================================================

    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"


    # =====================================================
    # FRAME AYARLARI
    # =====================================================

    global_frame: odom
    robot_base_frame: base_footprint

    transform_tolerance: 0.5


    # =====================================================
    # TIME
    # =====================================================

    use_sim_time: False


    # =====================================================
    # BEHAVIOR AYARLARI
    # =====================================================

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0

    min_rotational_vel: 0.4

    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False


waypoint_follower:
  ros__parameters:

    use_sim_time: False

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: True

      waypoint_pause_duration: 200


velocity_smoother:
  ros__parameters:

    use_sim_time: False

    smoothing_frequency: 20.0

    scale_velocities: False

    feedback: "OPEN_LOOP"

    # =====================================================
    # VELOCITY LIMITLERI
    # =====================================================
    #
    # Burada negatif hız açık BIRAKILIYOR.
    #
    # Bunun nedeni ParkFollowPath controller'ın
    # park sırasında negatif linear.x gönderebilmesi.
    #
    # Normal FollowPath:
    # allow_reversing: false
    #
    # Normal GridBased:
    # DUBIN
    #
    # olduğu için normal navigasyonda negatif komut
    # üretilmeyecek.
    #
    # ParkFollowPath:
    # allow_reversing: true
    #
    # ParkingGrid:
    # REEDS_SHEPP
    #
    # olduğu için park.py sırasında geri sürüş mümkün.
    # =====================================================

    max_velocity: [0.8, 0.0, 0.40]

    # Maksimum geri park hızı = 0.20 m/s
    min_velocity: [-0.2, 0.0, -0.40]

    max_accel: [0.5, 0.0, 1.0]

    max_decel: [-0.5, 0.0, -1.0]

    odom_topic: "odom"

    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0
