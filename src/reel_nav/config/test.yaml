controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 30.0

    controller_plugins: ["FollowPath", "ParkFollowPath"]

    goal_checker_plugins: ["general_goal_checker"]

    use_collision_checker: true

    progress_checker.movement_time_allowance: 50.0
    progress_checker.required_movement_radius: 0.001


    # ==========================================================
    # NORMAL NAVİGASYON GOAL CHECKER
    # ==========================================================

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      # Normal navigasyon için mevcut toleransların
      xy_goal_tolerance: 1.0

      # 0.7 rad ≈ 40 derece
      yaw_goal_tolerance: 0.7

      stateful: True




    # ==========================================================
    # NORMAL CONTROLLER
    # SADECE İLERİ SÜRÜŞ
    # ==========================================================
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.8

      # Normal navigasyonda geri sürüş kapalı.
      allow_reversing: false

      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 2.0

      max_allowed_time_to_collision_up_to_carrot: 5.0
      use_collision_detection: true

      # ==========================================
      # LOOKAHEAD
      # ==========================================

      # Daha uzağa bak → daha yumuşak direksiyon
      lookahead_dist: 5.0

      min_lookahead_dist: 1.8
      max_lookahead_dist: 7.0

      lookahead_time: 5.0

      use_velocity_scaled_lookahead_dist: true

      use_fixed_curvature_lookahead: true

      use_interpolation: true

      max_robot_pose_search_dist: 5.0

      # ==========================================
      # ACKERMANN
      # ==========================================

      use_rotate_to_heading: false

      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5

      # ==========================================
      # VIRAJDA HIZ DUSUR
      # ==========================================

      use_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 2.5

      regulated_linear_scaling_min_speed: 0.45

      use_cost_regulated_linear_velocity_scaling: true

      cost_scaling_dist: 1.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.2

      transform_tolerance: 0.5


    # ==========================================================
    # PARK CONTROLLER
    # İLERİ + GERİ SÜRÜŞ
    # ==========================================================
    ParkFollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Park sırasında daha kontrollü hız.
      desired_linear_vel: 0.65

      # Sadece park.py bu controller'ı çağıracak.
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5

      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 1.0

      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true

      # ==========================================
      # PARK LOOKAHEAD
      # ==========================================

      # Park sırasında normal sürüşe göre
      # daha yakındaki path geometrisini takip et.
      lookahead_dist: 1.0

      min_lookahead_dist: 0.8
      max_lookahead_dist: 1.5

      lookahead_time: 1.0

      use_velocity_scaled_lookahead_dist: true

      use_fixed_curvature_lookahead: false

      use_interpolation: true

      max_robot_pose_search_dist: 5.0

      # ==========================================
      # ACKERMANN
      # ==========================================

      # Araç yerinde dönemediği için false.
      use_rotate_to_heading: false

      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5

      # ==========================================
      # PARKTA VIRAJ HIZ KONTROLU
      # ==========================================

      use_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 5.0

      regulated_linear_scaling_min_speed: 0.3

      use_cost_regulated_linear_velocity_scaling: false

      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.2

      transform_tolerance: 0.5


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 8.0

      global_frame: odom
      robot_base_frame: base_footprint

      use_sim_time: False

      rolling_window: true

      width: 16
      height: 16
      resolution: 0.1

      footprint: "[[1.35, 0.775], [1.35, -0.775], [-1.35, -0.775], [-1.35, 0.775]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 1.2
        inflation_radius: 2.0

        always_send_full_costmap: False

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: True
        observation_sources: scan 


        # /rslidar_points -> pointcloud_to_laserscan -> /scan_nav
        # pointcloud_to_laserscan filtresi:
        #   height: -0.05 ... 1.80 m
        #   range :  0.50 ... 12.0 m
        scan:
          topic: /scan_nav

          clearing: True
          marking: True

          data_type: "LaserScan"

          # Local costmap 12x12 m ve robot merkezde olduğu için
          # düz yönde yaklaşık 6 m kullanılabilir alan bulunuyor.
          raytrace_min_range: 3.0
          obstacle_min_range: 3.0

          raytrace_max_range: 7.0
          obstacle_max_range: 6.8


          # pointcloud_to_laserscan use_inf=True olduğu için
          # +inf ölçümleri boş alan temizlemede kullanılabilsin.
          inf_is_valid: true

          # Gerçek LaserScan sürekli geldiği için eski lidar ölçümünü tutma.
          observation_persistence: 6.0





global_costmap:
  global_costmap:
    ros__parameters:

      always_send_full_costmap: True

      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint

      use_sim_time: False

      footprint: "[[1.35, 0.775], [1.35, -0.775], [-1.35, -0.775], [-1.35, 0.775]]"

      resolution: 0.1

      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "middle_lane_cost_layer"]


      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: True

        observation_sources: scan  sign_obstacles_global


        # /rslidar_points -> pointcloud_to_laserscan -> /scan_nav
        scan:
          topic: /scan_nav

          clearing: True
          marking: True

          data_type: "LaserScan"

          # pointcloud_to_laserscan range_max ile aynı clearing menzili.
          raytrace_max_range: 7.0
          raytrace_min_range: 0.5

          # Son 0.5 m yalnız clearing payı olarak bırakılıyor.
          obstacle_max_range: 7.1
          obstacle_min_range: 0.5

          inf_is_valid: true

          observation_persistence: 6.0




        sign_obstacles_global:
          topic: /sign_obstacles_global

          max_obstacle_height: 2.0

          clearing: True
          marking: True

          data_type: "PointCloud2"

          raytrace_min_range: 3.0
          obstacle_min_range: 3.0

          raytrace_max_range: 7.0
          obstacle_max_range: 6.8



      middle_lane_cost_layer:
        plugin: "middle_lane_cost_layer::MiddleLaneCostLayer"

        enabled: true

        csv_path: "~/real_ws/src/middle_lane_cost_layer/config/road_segments_50_points.csv"

        lane_half_width: 1.2

        lane_cost: 230


      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: True


      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 1.2
        inflation_radius: 2.0


