    # PCL'den mutlak map x, y ve yaw
    pose0_config: [
      true,  true,  false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]

    pose0_queue_size: 50
    pose0_nodelay: false
    pose0_differential: false
    pose0_relative: false

    use_control: false


# ================================================================
# NAVSAT TRANSFORM
# ================================================================

navsat_transform_node:
  ros__parameters:

    use_sim_time: false

    frequency: 10.0
    delay: 3.0

    magnetic_declination_radians: 0.0
    yaw_offset: 0.0

    zero_altitude: true

    broadcast_utm_transform: false
    broadcast_utm_transform_as_parent_frame: false

    publish_filtered_gps: true

    # Heading /imu/data topic'inden alınır.
    use_odometry_yaw: false

    wait_for_datum: true
    #datum: [40.7893981714, 29.5090583571, 158.558]
    #LLH = [40.7893813267, 29.5090488533, 157.458]
    datum: [40.7904240077, 29.5092174538, 156.906]